<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-labelledby="title desc"><title id="title">WiseLanka hybrid architecture</title><desc id="desc">A typed profile enters FastAPI. Authoritative rules produce academic groups. Local relevance ranks within groups. CSV knowledge feeds rules, ranking and supporting domain engines. Separate outputs return to the learner.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526577"/></marker></defs><rect width="900" height="570" rx="18" fill="#f1f5f7"/>
<style>text{font-family:Arial,sans-serif;fill:#142b3c;font-size:21px}.small{font-size:18px}.box{fill:white;stroke:#a1b2bf;stroke-width:2}.strong{fill:#e3f3ef;stroke:#137769;stroke-width:2}.line{fill:none;stroke:#526577;stroke-width:2;marker-end:url(#arrow)}</style>
<rect x="30" y="25" width="840" height="64" rx="10" class="box"/><text x="450" y="52" text-anchor="middle">Browser profile / results / guided support</text><text x="450" y="76" text-anchor="middle" class="small">Draft en / si / ta interface · optional browser voice + text</text>
<path d="M450 90V113" class="line"/><rect x="235" y="116" width="430" height="55" rx="9" class="box"/><text x="450" y="150" text-anchor="middle">FastAPI validation + orchestration</text>
<path d="M450 172V196" class="line"/><rect x="235" y="199" width="430" height="75" rx="9" class="strong"/><text x="450" y="228" text-anchor="middle">Authoritative academic rules</text><text x="450" y="254" text-anchor="middle" class="small">MET / NOT_ASSESSED / NOT_MET</text>
<rect x="28" y="200" width="175" height="157" rx="9" class="box"/><text x="115" y="236" text-anchor="middle">Curated CSV</text><text x="115" y="265" text-anchor="middle">+ sources</text><text x="115" y="295" text-anchor="middle" class="small">Integrity checks</text><text x="115" y="323" text-anchor="middle" class="small">No database</text><path d="M204 237H233" class="line"/>
<path d="M450 275V298" class="line"/><rect x="235" y="301" width="430" height="82" rx="9" class="strong"/><text x="450" y="331" text-anchor="middle">Rank only within academic groups</text><text x="450" y="359" text-anchor="middle" class="small">MiniLM ONNX / TF–IDF / deterministic</text><path d="M204 342H233" class="line"/>
<rect x="697" y="202" width="175" height="181" rx="9" class="box"/><text x="784" y="233" text-anchor="middle">Other engines</text><text x="784" y="262" text-anchor="middle" class="small">Progression</text><text x="784" y="288" text-anchor="middle" class="small">Alternatives</text><text x="784" y="314" text-anchor="middle" class="small">Skills / careers</text><text x="784" y="340" text-anchor="middle" class="small">Scholarships</text><text x="784" y="367" text-anchor="middle" class="small">Read-only guide</text>
<path d="M665 144H784V198" class="line"/><path d="M450 384V417" class="line"/><path d="M784 384V456H668" class="line"/>
<rect x="235" y="420" width="430" height="79" rx="9" class="box"/><text x="450" y="451" text-anchor="middle">Separate status, relevance and reasons</text><text x="450" y="480" text-anchor="middle" class="small">Official links · conditions · missing evidence</text><text x="450" y="541" text-anchor="middle" class="small">Similarity never overrides eligibility. Guidance is not admission.</text></svg>
