services:
  - type: web
    name: wiselanka-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: python -m uvicorn backend.app.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: WISELANKA_CORS_ORIGINS
        sync: false
